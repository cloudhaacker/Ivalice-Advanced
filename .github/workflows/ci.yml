# CI tier 1 — fork-safe, no private material (no ROM/savestates; the launch
# BIOS is committed clean-room repo material — bios/, issue #17).
# Runs the host unit tests (C++/Python), the recomp-ui runtime-UI tests,
# patch integrity, and the device-free Android checks on a fresh checkout. The full gate (attract,
# widescreen smoke, route replays) needs game.gba + BIOS + the local
# fixtures and belongs on a self-hosted runner gated to trusted events —
# see tests/README.md § Continuous integration.
name: CI (tier 1)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two passes mirror the local recipe: the first init can leave nested
      # worktrees empty (arm-recomp-core), the --checkout pass fixes them.
      - name: Pinned submodules
        run: |
          git submodule update --init --recursive
          git submodule update --checkout --recursive

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl-dev ccache

      # Cache pip so the capstone wheel isn't re-downloaded every run.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ffta-pip-${{ runner.os }}-py312-${{ hashFiles('.venv/pyvenv.cfg') }}
          restore-keys: |
            ffta-pip-${{ runner.os }}-py312-

      # Cache ccache so C++ compiles reuse prior objects across runs.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ffta-ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ffta-ccache-${{ runner.os }}-

      # Cache the CMake build dir so `ffta_unit_tests` rebuilds incrementally.
      - name: Cache CMake build dir
        uses: actions/cache@v4
        with:
          path: build
          key: ffta-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ffta-build-${{ runner.os }}-

      # unit-py imports tools/misspack.py, which needs capstone. Local runs
      # always use .venv (docs/manual-build.md); the runner needs the same dep on
      # the interpreter that runs check.py (sys.executable). Pinned to the
      # .venv version; manylinux py3-none wheel, nothing to build.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps (unit-py)
        run: python3 -m pip install "capstone==5.0.7"

      # The Phase 4c default (raylib ON) is inert here: gbarecompx/ is
      # untracked until Phase 7, so GBARECOMP_ROOT falls back to the pinned
      # gbarecomp submodule and the raylib option is never consumed.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Gate (unit-cpp, unit-py, patches, android-static)
        run: python3 tools/check.py --only unit-cpp,unit-py,patches,android-static

  raylib-backend:
    # Compiles the raylib PRODUCT backend (the default since Phase 4c) and RUNS
    # it headless. The gate configures the canonical `build/` dir with defaults
    # only, so it also fails if the default flip regresses to the stub.
    #
    # GitHub's ubuntu runners have no GPU, no /dev/dri and no X server, so this
    # is where the raylib path gets its first real signal from something other
    # than a developer's desktop: Xvfb supplies a virtual X server and
    # LIBGL_ALWAYS_SOFTWARE=1 puts Mesa's llvmpipe rasterizer underneath, which
    # satisfies raylib's OpenGL 3.3 core requirement with no hardware. The gate
    # picks that up automatically when there is no DISPLAY.
    #
    # Skips cleanly (exit 0, "no gbarecompx tree") while gbarecompx/
    # is untracked, so this job is inert until that tree is committed rather than
    # a red build.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pinned submodules
        run: |
          git submodule update --init --recursive
          git submodule update --checkout --recursive

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev \
            libfreetype-dev libharfbuzz-dev libsdl2-dev \
            xvfb libgl1-mesa-dri ccache

      # Cache ccache across runs; the raylib _deps cache (below) stays keyed on
      # gbarecompx/CMakeLists.txt so a pin bump re-clones cleanly.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ffta-ccache-raylib-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ffta-ccache-raylib-${{ runner.os }}-

      # Configures build/ with default flags (raylib is the product default
      # since Phase 4c), builds gbarecomp_raylib_backend, then builds and runs
      # ffta_raylib_present_tests.
      # Deliberately builds nothing that needs the ROM: generated/ is
      # gitignored, and the integration test is kept link-lean (raylib +
      # gbarecomp_raylib_backend only) precisely so it works on a fresh
      # checkout.
      # Pre-Phase-7 this job skips (no gbarecompx tree); once the framework is
      # tracked, the suite configures build/ and fetches raylib — cache the
      # clone + build so runs reuse it.
      - name: Cache raylib FetchContent (clone + build)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ffta-raylib-deps-${{ runner.os }}-${{ hashFiles('gbarecompx/CMakeLists.txt') }}

      - name: "Gate (raylib-compile: build + run headless under Xvfb)"
        run: CC="ccache gcc" CXX="ccache g++" python3 tools/check.py --only raylib-compile
