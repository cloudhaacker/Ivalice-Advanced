# Release — tag-triggered, GitHub-hosted, NO private material.
#
# The release artifacts are built and verified on the maintainer's machine
# (where the ROM lives) and uploaded with tools/publish_release.py. This
# workflow deliberately does not check out the game tree, bootstrap the
# corpus, or run the full gate: none of that can happen on GitHub without
# the private dump, and it must never be uploaded there.
#
# What it does:
#   - tag push: creates a DRAFT release for the tag (or leaves an existing
#     release untouched), so the local upload has a destination;
#   - workflow_dispatch: same, for an existing tag, as a recovery path.
#
# The local publisher attaches:
#   FFTARecomp-<tag>-linux-x64.zip
#   FFTARecomp-<tag>-linux-x86_64.AppImage
#   FFTARecomp-<tag>-windows-x64.zip
#   FFTARecomp-<tag>-android-arm64-v8a.apk
#   SHA256SUMS-<tag>.txt
# and publishes the draft when asked (tools/publish_release.py --publish).
name: Release (tag)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to prepare (e.g. v1.7)
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft release shell
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: give gh the repository explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          # Dispatch must not create a tag at the default branch: require
          # the tag to exist first. A tag push obviously satisfies this.
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" --draft --generate-notes \
            --title "FFTARecomp $TAG"
          echo "created draft release $TAG — build locally, then run:"
          echo "  .venv/bin/python tools/publish_release.py --version $TAG"
