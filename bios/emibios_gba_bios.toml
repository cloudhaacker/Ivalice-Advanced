# emibios_gba_bios.toml — per-binary recompile config for emibios (coolbho3k/emibios).
#
# Generated from the emibios build ELF (zig build -> bios.elf; 2026-10-11,
# main @ c4d5d71). Function modes derive from the $a/$t mapping symbols;
# hand-coded vector tail (0x08 SWI, 0x18 IRQ) mirrors bios/gba_bios.toml.
# emibios is a clean-room LGPL-3.0-or-later BIOS replacement:
# https://github.com/coolbho3k/emibios

[program]
name         = "emibios GBA BIOS"
id           = "emibios_gba_bios"
load_address = 0x00000000
size         = 0x00004000  # 16 KB
entry_pc     = 0x00000000
static_resume_all = true  # BIOS instructions can be interrupted and resumed anywhere

[identity]
sha1 = "0c0d404d16c6b55b3071aba714f82077da132f14"  # emibios main @c4d5d71

