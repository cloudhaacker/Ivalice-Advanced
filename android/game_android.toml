# Android runtime config — Gradle stages this into the app payload as
# variants/final_fantasy_tactics_advance/game.toml under the app's private
# files/ directory (mobile_prepare_process chdirs there first).
#
# Runtime-only: the recompiled corpus is produced on desktop from the full
# game.toml; this file carries just what the runtime reads at launch. ROM and
# BIOS are never packaged publicly — the setup activity imports them through
# the SAF picker and verifies size + SHA-1 against the manifest pins.

[game]
name = "Final Fantasy Tactics Advance"
short_name = "final_fantasy_tactics_advance"
default_region = "USA"

[bios]
path = "../../bios/emibios_gba_bios.bin"
sha1 = "0c0d404d16c6b55b3071aba714f82077da132f14"
# Clean-room emibios (LGPL-3.0-or-later) staged into the payload at
# bios/emibios_gba_bios.bin (build.gradle payloadDirs; issue #17) —
# bundled with the APK, no user-supplied BIOS dump. Same HLE story as
# game.toml [bios]: zero-fallback census routes all HLE-taken; LLE linked
# for fallback + IRQ dispatch.
hle = true

[rom]
path = "../../roms/ffta_usa.gba"
sha1 = "4ac05441f4de70a4ec3dd932116346c61b8783d9"

[save]
type = "flash512"
size = 65536
path = "../../saves/ffta_us.sav"

[video]
screen = "raw"                  # exact BGR555 passthrough (desktop parity)
view_width = 240                # native start; the host display selects the width below
# Android opt-in for the desktop-validated resize-driven expanded view: fills
# the display at the drawable aspect (clamped to the 448 cap authorized by
# RunOptions.max_view_width). Desktop keeps its opt-in flag (--resize-view).
resize_view = true

[touch]
# The pad's millimetre layout is scaled down a step on phones: the authored
# sizes (1.0) read large in the hand on a 6.8" panel. Tune with
# --touch-pad-scale (debug-args.txt) or this key; 0.5..1.5.
pad_scale = 0.85

[audio]
shadow = false                  # no MP2K shadow mixer; recompiled canon only

[runtime]
debug_port = 19888
window_title = "FFTARecomp"
